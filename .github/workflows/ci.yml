# Modified 2026-10 by PLN: CI test job, actions pinned to v5 (GPL-3.0; see NOTICE).
# Modified 2026-10 by PLN: CI Node is 22.14.0 (GPL-3.0; see NOTICE).
# Test-job idea adapted from dvaerum/pikvm_mcp_server
# .github/workflows/ci.yml @ 00cbfc0207c1be2b28b25679019e7fe9bd9d9654
# (GPL-3.0, test job only).

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
