# Modified 2026-10 by PLN: publish condition test stub (GPL-3.0; see NOTICE).
#
# Called by release-condition-test.yml. The release job graph (verify,
# build, smoke, scan) with results taken from inputs, a probe job that
# carries the exact publish condition, and an assert job. Builds and
# publishes nothing. A stub that fails on purpose sets continue-on-error,
# so the run stays green while dependants still see the failure; assert
# checks that each stub produced the requested result.
name: release-condition-stub

on:
  workflow_call:
    inputs:
      verify:
        description: success or failure
        type: string
        required: true
      resume:
        description: verify's resume output, 'true', 'false' or empty
        type: string
        required: false
        default: ''
      build:
        description: success, failure or skipped
        type: string
        required: true
      smoke:
        description: success, failure or skipped
        type: string
        required: true
      scan:
        description: success, failure or skipped
        type: string
        required: true
      expect:
        description: run or skip, what publish must do
        type: string
        required: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: ${{ inputs.verify == 'failure' }}
    outputs:
      resume: ${{ steps.out.outputs.resume }}
    steps:
      - id: out
        env:
          RESUME: ${{ inputs.resume }}
          RESULT: ${{ inputs.verify }}
        run: |
          echo "resume=$RESUME" >> "$GITHUB_OUTPUT"
          [ "$RESULT" = success ]

  build:
    needs: verify
    if: inputs.build != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: ${{ inputs.build == 'failure' }}
    steps:
      - env:
          RESULT: ${{ inputs.build }}
        run: '[ "$RESULT" = success ]'

  smoke:
    needs: [verify, build]
    if: inputs.smoke != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: ${{ inputs.smoke == 'failure' }}
    steps:
      - env:
          RESULT: ${{ inputs.smoke }}
        run: '[ "$RESULT" = success ]'

  scan:
    needs: [verify, build]
    if: inputs.scan != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: ${{ inputs.scan == 'failure' }}
    steps:
      - env:
          RESULT: ${{ inputs.scan }}
        run: '[ "$RESULT" = success ]'

  probe:
    needs: [verify, build, smoke, scan]
    # One line: release-condition-test.yml matches it against test/fixtures/release-publish-if.txt.
    if: ${{ !cancelled() && needs.verify.result == 'success' && ( (needs.verify.outputs.resume != 'true' && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.scan.result == 'success') || (needs.verify.outputs.resume == 'true' && needs.build.result == 'skipped' && needs.smoke.result == 'skipped' && needs.scan.result == 'skipped') ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "publish would run"

  assert:
    needs: [verify, build, smoke, scan, probe]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          WANT: ${{ inputs.verify }} ${{ inputs.build }} ${{ inputs.smoke }} ${{ inputs.scan }}
          GOT: ${{ needs.verify.result }} ${{ needs.build.result }} ${{ needs.smoke.result }} ${{ needs.scan.result }}
          RESUME: ${{ needs.verify.outputs.resume }}
          EXPECT: ${{ inputs.expect }}
          PROBE: ${{ needs.probe.result }}
        run: |
          echo "verify build smoke scan: wanted $WANT, got $GOT; resume '$RESUME'; probe $PROBE; expected $EXPECT"
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::the stubs did not produce the requested results, so this case tests nothing"
            exit 1
          fi
          case $EXPECT in
            run) want=success ;;
            skip) want=skipped ;;
            *) echo "::error::expect must be run or skip"; exit 1 ;;
          esac
          if [ "$PROBE" != "$want" ]; then
            echo "::error::publish condition: probe was $PROBE, expected $want"
            exit 1
          fi
